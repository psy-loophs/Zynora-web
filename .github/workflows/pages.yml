name: Deploy Zynora Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          set -euo pipefail

          mkdir -p _site

          cp index.html _site/
          cp api.js _site/
          cp script.js _site/
          cp style.css _site/

          touch _site/.nojekyll

      - name: Verify deployment files
        run: |
          set -euo pipefail

          test -s _site/index.html
          test -s _site/api.js
          test -s _site/script.js
          test -s _site/style.css

          if grep -q 'HF_TOKEN' _site/api.js; then
            echo "ERROR: HF_TOKEN must not be exposed"
            exit 1
          fi

          echo "SUCCESS: All files verified"
          echo "SUCCESS: No HF_TOKEN exposed"

          ls -lah _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
