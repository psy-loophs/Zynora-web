name: Deploy Zynora Website

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Prepare website
    run: |
      set -euo pipefail

      mkdir -p _site

      cp index.html _site/
      cp script.js _site/
      cp style.css _site/

      python - <<'PY'
      import json
      from pathlib import Path

      config = {
          "API_BASE_URL": "https://psy-loophs-zynora-proxy.hf.space/proxy"
      }

      Path("_site/config.js").write_text(
          "window.ZYNORA_CONFIG = "
          + json.dumps(config)
          + ";\n",
          encoding="utf-8"
      )

      print("SUCCESS: Public configuration generated without secrets")
      PY

      touch _site/.nojekyll

  - name: Verify deployment files
    run: |
      set -euo pipefail

      test -s _site/index.html
      test -s _site/script.js
      test -s _site/style.css
      test -s _site/config.js

      python - <<'PY'
      import json
      from pathlib import Path

      content = Path("_site/config.js").read_text().strip()
      prefix = "window.ZYNORA_CONFIG = "

      if not content.startswith(prefix) or not content.endswith(";"):
          raise SystemExit("ERROR: Invalid config.js")

      config = json.loads(content[len(prefix):-1])

      if config.get("API_BASE_URL") != "https://psy-loophs-zynora-proxy.hf.space/proxy":
          raise SystemExit("ERROR: Unexpected API_BASE_URL")

      if "HF_TOKEN" in config:
          raise SystemExit("ERROR: HF_TOKEN must not be exposed")

      print("SUCCESS: Configuration verified")
      print("SUCCESS: No HF_TOKEN included")
      PY

      ls -lah _site/

  - name: Configure Pages
    uses: actions/configure-pages@v5

  - name: Upload website
    uses: actions/upload-pages-artifact@v3
    with:
      path: ./_site

deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}

runs-on: ubuntu-latest
needs: build

steps:
  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4
