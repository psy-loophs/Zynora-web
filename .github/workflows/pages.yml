name: Deploy Zynora Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate frontend configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: |
          python - <<'PY'
          import json
          import os

          token = os.environ.get("HF_TOKEN", "").strip()
          space_url = os.environ.get("HF_SPACE_URL", "").strip()

          if not token:
              raise SystemExit("ERROR: HF_TOKEN secret is missing or empty")

          if not space_url:
              raise SystemExit("ERROR: HF_SPACE_URL secret is missing or empty")

          config = {
              "API_BASE_URL": space_url.rstrip("/"),
              "HF_TOKEN": token
          }

          with open("config.js", "w", encoding="utf-8") as file:
              file.write(
                  "window.ZYNORA_CONFIG = "
                  + json.dumps(config)
                  + ";\n"
              )

          print("SUCCESS: config.js generated")
          PY

      - name: Verify frontend configuration
        run: |
          if [ ! -f config.js ]; then
            echo "ERROR: config.js was not generated"
            exit 1
          fi

          if ! grep -Eq '"API_BASE_URL"[[:space:]]*:[[:space:]]*"https://' config.js; then
            echo "ERROR: API_BASE_URL is missing or invalid"
            exit 1
          fi

          if ! grep -Eq '"HF_TOKEN"[[:space:]]*:[[:space:]]*"[^"]+"' config.js; then
            echo "ERROR: HF_TOKEN is missing"
            exit 1
          fi

          echo "SUCCESS: Both configuration fields are present"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
