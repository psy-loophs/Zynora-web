name: Deploy Zynora Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate frontend configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: |
          python - <<'PY'
          import json
          import os

          config = {
              "API_BASE_URL": os.environ["HF_SPACE_URL"].rstrip("/"),
              "HF_TOKEN": os.environ["HF_TOKEN"]
          }

          with open("config.js", "w", encoding="utf-8") as file:
              file.write(
                  "window.ZYNORA_CONFIG = "
                  + json.dumps(config)
                  + ";\n"
              )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
